<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Student Feedback Form</h2>

        <form id="feedbackForm" novalidate>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="">
                <div class="error" id="nameError"></div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="">
                <div class="error" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <select id="course">
                    <option value="">Select Course</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Mechanical Engineering">Mechanical Engineering</option>
                    <option value="Civil Engineering">Civil Engineering</option>
                </select>
                <div class="error" id="courseError"></div>
            </div>

            <div class="form-group">
                <label for="feedback">Feedback</label>
                <textarea id="feedback" rows="4"></textarea>
                <div class="error" id="feedbackError"></div>
            </div>

            <div class="btn-group">
                <button type="submit" id="submitBtn">Submit Feedback</button>
                <button type="button" id="deleteBtn">Delete Stored Data</button>
            </div>
        </form>

        <h3 id="sessionUserDisplay">Current Session User: </h3>

        <h3>Stored Feedback</h3>

        <div id="output">No feedback stored.</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
